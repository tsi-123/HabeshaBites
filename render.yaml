services:
  # Backend API — Node.js on Render Web Service
  - type: web
    name: habeshabites-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (sync: false = secret/manual):
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SALT
        value: "10"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
    healthCheckPath: /
    autoDeploy: true
    # Persistent disk for uploaded food/profile images (survives redeploys)
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
